<title>School99 — Splash Screen</title>

<!--
  ────────────────────────────────────────────────────────────────
  SWAP IN THE REAL LOGO
  Replace the <svg class="wordmark"> block inside .logo-tile with:
     <img class="wordmark" src="school99-logo.png" alt="School99" />
  Nothing else needs to change — the tile, glow, and animations
  size the logo automatically. Keep the logo's own aspect ratio.
  ────────────────────────────────────────────────────────────────
-->

<style>
  :root {
    /* Deliberately chosen palette — deep navy ground, warm brand red */
    --navy-abyss:  #061634;
    --navy-deep:   #0A1F44;
    --navy-mid:    #123E8A;
    --navy-lift:   #1B54B0;
    --brand-red:   #E4322B;
    --brand-red-lo:#B71F1A;
    --ink:         #0C1220;
    --tile-top:    #FFFFFF;
    --tile-bot:    #EEF3FC;
    --glow-blue:   rgba(84, 131, 179, 0.55);
    --text-soft:   #C6D6F5;
    --text-faint:  rgba(198, 214, 245, 0.62);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  .splash {
    position: fixed;
    inset: 0;
    /* honor notches, Dynamic Island, nav bars */
    padding:
      calc(env(safe-area-inset-top) + 24px)
      calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 24px)
      calc(env(safe-area-inset-left) + 24px);
    display: grid;
    grid-template-rows: 1fr auto;
    align-items: center;
    justify-items: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 system-ui, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 8%,  #14479B 0%, transparent 55%),
      radial-gradient(140% 120% at 50% 118%, #071B3E 0%, transparent 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
    color: #fff;
  }

  /* ── Ambient atmosphere: two soft light orbs, slow drift ── */
  .aura {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    pointer-events: none;
    will-change: transform;
  }
  .aura--1 {
    width: 58vmin; height: 58vmin;
    top: -14vmin; left: -10vmin;
    background: radial-gradient(circle, rgba(64,120,220,0.60), transparent 68%);
    animation: drift1 14s ease-in-out infinite;
  }
  .aura--2 {
    width: 52vmin; height: 52vmin;
    bottom: -16vmin; right: -12vmin;
    background: radial-gradient(circle, rgba(30,84,176,0.55), transparent 68%);
    animation: drift2 17s ease-in-out infinite;
  }
  /* faint fine grid for depth — barely there */
  .splash::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(70% 60% at 50% 42%, #000 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(70% 60% at 50% 42%, #000 0%, transparent 80%);
    pointer-events: none;
  }

  /* ── Centered brand stack ── */
  .brand {
    position: relative;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(22px, 4.5vh, 40px);
    opacity: 0;
    animation: fadeUp 600ms cubic-bezier(.22,.61,.36,1) 120ms forwards;
  }

  .logo-shell {
    position: relative;
    display: grid;
    place-items: center;
    animation: float 4.6s ease-in-out 900ms infinite;
  }

  /* glowing halo behind the tile */
  .logo-shell::after {
    content: "";
    position: absolute;
    inset: -22%;
    border-radius: 42%;
    background: radial-gradient(circle, var(--glow-blue), transparent 70%);
    filter: blur(26px);
    z-index: -1;
    animation: haloPulse 3.8s ease-in-out infinite;
  }

  .logo-tile {
    width: clamp(140px, 32vw, 320px);
    aspect-ratio: 1 / 1;
    max-width: 320px;
    border-radius: 26%;
    background: linear-gradient(155deg, var(--tile-top), var(--tile-bot));
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 24px 60px -18px rgba(3, 12, 32, 0.75),
      0 4px 14px rgba(3, 12, 32, 0.35);
    display: grid;
    place-items: center;
    padding: 16%;
  }

  .wordmark {
    width: 100%;
    height: auto;
    display: block;
  }

  .tagline {
    margin: 0;
    font-size: clamp(12px, 1.9vh, 15px);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-soft);
    text-align: center;
    text-wrap: balance;
  }
  .tagline b { color: #fff; font-weight: 600; }

  /* ── Loading zone ── */
  .loader {
    grid-row: 2;
    width: min(60vw, 240px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: clamp(8px, 3vh, 28px);
    opacity: 0;
    animation: fadeUp 600ms ease 520ms forwards;
  }

  .bar {
    position: relative;
    width: 100%;
    height: 3px;
    border-radius: 99px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .bar::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 42%;
    border-radius: 99px;
    background: linear-gradient(90deg,
      transparent, #7DA0CA 20%, #C1E8FF 50%, #7DA0CA 80%, transparent);
    box-shadow: 0 0 12px 2px rgba(193, 232, 255, 0.65);
    animation: sweep 1.5s cubic-bezier(.65,.05,.36,1) infinite;
  }

  .loader small {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  /* ── Keyframes ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0)     scale(1);    }
    50%      { transform: translateY(-6px)  scale(1.05); }
  }
  @keyframes haloPulse {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50%      { opacity: 0.9;  transform: scale(1.06); }
  }
  @keyframes sweep {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(340%);  }
  }
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(6vmin, 4vmin); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-5vmin, -4vmin); }
  }

  /* Landscape / short viewports: tighten the vertical rhythm */
  @media (orientation: landscape) and (max-height: 520px) {
    .logo-tile { width: clamp(120px, 22vh, 200px); }
    .brand { gap: 18px; }
  }

  /* Large tablets: cap growth so it never feels sparse */
  @media (min-width: 1024px) {
    .logo-tile { width: clamp(240px, 26vw, 320px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .loader { animation: fadeUp 400ms ease forwards; }
    .logo-shell, .logo-shell::after, .aura--1, .aura--2 { animation: none; }
    .bar::before { animation: sweep 2.4s linear infinite; }
  }
</style>

<div class="splash" role="img" aria-label="School99 — Smart Schools. Better Tomorrow.">
  <div class="aura aura--1"></div>
  <div class="aura aura--2"></div>

  <div class="brand">
    <div class="logo-shell">
      <div class="logo-tile">
        <!-- Placeholder wordmark — swap for the real School99 logo (see top comment) -->
        <svg class="wordmark" viewBox="0 0 300 108" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g font-family="-apple-system, 'Segoe UI', Roboto, system-ui, sans-serif" font-weight="800">
            <text x="150" y="58" text-anchor="middle" font-size="52"
                  letter-spacing="-1.5" fill="#0C1220">School<tspan fill="#E4322B">99</tspan></text>
            <rect x="93" y="76" width="114" height="5" rx="2.5" fill="#E4322B"/>
            <text x="150" y="99" text-anchor="middle" font-size="12.5"
                  font-weight="600" letter-spacing="4" fill="#5A6478">E R P</text>
          </g>
        </svg>
      </div>
    </div>

    <p class="tagline">Smart Schools. <b>Better Tomorrow.</b></p>
  </div>

  <div class="loader">
    <div class="bar"></div>
    <small>Loading</small>
  </div>
</div>
